name: Test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the Python tests: the simulator and the server, never a real keyboard
  pytest:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, macos-15]

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: test-requirements.txt

    - name: hidapi's libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev dbus

    - name: Python packages
      run: python -m pip install -r test-requirements.txt

    - name: Run tests
      run: python -m pytest -v -n auto --dist worksteal src/main/python/test

  # the web UI: checks, unit tests, the build, the API types, and the end-to-end tests against vial_web.py --fake
  web:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            checks: true
          # end-to-end only: the rest doesn't depend on the system
          - runner: windows-2025
            checks: false

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: web

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: requirements.txt

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json

    # the server code generates the API types and serves the UI in the end-to-end tests (simulated keyboard only);
    # VIAL_PYTHON tells web/scripts/python.mjs which Python runs it
    - name: Python packages
      working-directory: .
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev dbus
        fi
        python -m pip install -r requirements.txt
        echo "VIAL_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

    - name: Install
      run: npm ci

    - name: Check (svelte-check, tsc)
      if: matrix.checks
      run: npm run check

    - name: Unit tests
      if: matrix.checks
      run: npm test

    - name: Build
      run: npm run build

    - name: API types are up to date
      if: matrix.checks
      run: npm run check:api

    - name: End-to-end tests
      run: |
        npx --no-install playwright install --with-deps chromium
        npx playwright test

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-screenshots-${{ runner.os }}
        path: |
          web/e2e/screenshots/
          web/test-results/
        if-no-files-found: ignore
        retention-days: 7
