name: Build

# Vial as one executable on each system: dist/Vial.exe (Windows), dist/vial (Linux, macOS). Each build is smoke-tested
# with the simulated keyboard (--fake: the runners have no keyboards, and --fake is the rule anyway), and uploaded. On
# Windows and Linux the end-to-end tests run against the built executable too. A pushed tag vX.Y.Z (equal to
# version.py's VERSION) also makes a GitHub release of the three files, once every build has passed.

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows
            runner: windows-2025
            executable: dist/Vial.exe
            e2e: true
          # the oldest Ubuntu runner: the executable needs at least its glibc (2.35)
          - system: linux
            runner: ubuntu-22.04
            executable: dist/vial
            e2e: true
          # arm64, built as is: not tested beyond the smoke test
          - system: macos
            runner: macos-15
            executable: dist/vial
            e2e: false

    name: build-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: requirements.txt

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json

    # what hidapi's Linux backends link to, as the tests' runners install it
    - name: hidapi's libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev dbus

    - name: Python packages
      run: python -m pip install -r requirements.txt

    - name: Build the web UI
      working-directory: web
      run: |
        npm ci
        npm run build

    - name: Build the executable
      run: python -m PyInstaller vial.spec

    - name: Smoke test (simulated keyboard)
      run: python util/smoke_test.py "${{ matrix.executable }}"

    - uses: actions/upload-artifact@v4
      with:
        name: vial-${{ matrix.system }}
        path: ${{ matrix.executable }}
        if-no-files-found: error
        retention-days: 30

    - name: End-to-end tests against the executable
      if: matrix.e2e
      working-directory: web
      env:
        E2E_VIAL_CMD: ${{ matrix.executable }}
      run: |
        npx --no-install playwright install --with-deps chromium
        npx playwright test

    - uses: actions/upload-artifact@v4
      if: failure() && matrix.e2e
      with:
        name: e2e-results-${{ matrix.system }}
        path: web/test-results/
        if-no-files-found: ignore
        retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: The tag names version.py's version
      id: version
      run: |
        version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/main/python/version.py | tr -d '\r')
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::the tag $GITHUB_REF_NAME isn't v$version, the VERSION in src/main/python/version.py"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/download-artifact@v4
      with:
        pattern: vial-*
        path: artifacts

    # an artifact doesn't keep the executable bit: a .tar.gz does, for Linux and macOS
    - name: The release's files
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir release
        cp artifacts/vial-windows/Vial.exe "release/Vial-$VERSION-windows-x64.exe"
        chmod +x artifacts/vial-linux/vial artifacts/vial-macos/vial
        tar -czf "release/vial-$VERSION-linux-x64.tar.gz" -C artifacts/vial-linux vial
        tar -czf "release/vial-$VERSION-macos-arm64.tar.gz" -C artifacts/vial-macos vial
        (cd release && sha256sum -- * > SHA256SUMS.txt)
        cat release/SHA256SUMS.txt

    - name: The GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cat > notes.md <<EOF
        One file per system, built from $GITHUB_REF_NAME by the [Build run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
        How to run each one: [Download and run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#download-and-run).

        - **Windows:** \`Vial-$VERSION-windows-x64.exe\`. Put it in any folder and double-click it. It isn't signed: if SmartScreen stops it, choose *More info*, then *Run anyway*.
        - **Linux:** \`vial-$VERSION-linux-x64.tar.gz\`, built on Ubuntu 22.04 (it needs glibc 2.35 or newer). \`tar -xzf vial-$VERSION-linux-x64.tar.gz && ./vial\`. Vial needs a udev rule to see keyboards.
        - **macOS** (Apple silicon): \`vial-$VERSION-macos-arm64.tar.gz\`. Not tested beyond the CI's smoke test, and not signed or notarized.

        \`SHA256SUMS.txt\` has each file's SHA-256.
        EOF
        gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
          --title "Vial (web) $VERSION" --notes-file notes.md
